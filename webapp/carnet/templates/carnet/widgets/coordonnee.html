<div class="saisie-coordonnee" data-axe="{{ widget.axe }}" style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;max-width:32rem">{% for sous in widget.subwidgets %}<div style="{% if forloop.first %}flex:0 1 12rem;min-width:7rem{% else %}flex:0 0 7.5rem{% endif %}">{% include sous.template_name with widget=sous %}</div>{% endfor %}{% if widget.axe == "latitude" %}<button type="button" data-ma-position class="border border-base-500 rounded-default px-3 py-2 font-medium text-primary-600 dark:text-primary-500" style="display:inline-flex;align-items:center;gap:.25rem;white-space:nowrap"><span class="material-symbols-outlined" aria-hidden="true">my_location</span> Utiliser ma position</button><span data-etat-position role="status" class="text-sm" style="flex-basis:100%"></span>{% endif %}</div>
